<div class="page organization">
    <div class="page__container">
        <div class="page__header home">
            <h1>Organization</h1>
        </div>
        <div class="page__body">
            <div class="page__filters">
                <div class="form__group organization__search">
                    <div class="form__add-on">
                        <input class="form__element" type="text" id="formSearch" placeholder="Search Users...">
                        <span class="form__append">
                            <span class="icon">
                                <img src="../../../assets/icons/search.svg" alt="Search">
                            </span>
                        </span>
                    </div>
                </div>
                <button class="btn btn--outline btn--primary" (click)="openInviteUser()">Invite User</button>
            </div>
            <app-users-table></app-users-table>
        </div>
    </div>
</div>
